name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Build release binaries
        env:
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p dist
          go build -buildvcs=false -o /tmp/scrobbler-completion ./cmd/scrobbler
          for target in darwin/arm64 darwin/amd64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 \
              go build -buildvcs=false \
              -ldflags "-X github.com/deathrashed/lastfm-scrobbler/internal/version.Version=${VERSION} -X github.com/deathrashed/lastfm-scrobbler/internal/version.Commit=${COMMIT} -X github.com/deathrashed/lastfm-scrobbler/internal/version.Repository=${REPOSITORY}" \
              -o "dist/scrobbler-${target%/*}-${target#*/}" ./cmd/scrobbler

            platform=${target%/*}
            arch=${target#*/}
            package_dir="dist/package-${platform}-${arch}"
            mkdir -p "${package_dir}/completions"
            cp "dist/scrobbler-${platform}-${arch}" "${package_dir}/scrobbler"
            cp LICENSE "${package_dir}/LICENSE"
            /tmp/scrobbler-completion completion zsh > "${package_dir}/completions/_scrobbler"
            /tmp/scrobbler-completion completion fish > "${package_dir}/completions/scrobbler.fish"
            tar -C "${package_dir}" -czf "dist/scrobbler-${VERSION}-${platform}-${arch}.tar.gz" .
            rm -rf "${package_dir}"
          done
          sha256sum dist/* > dist/checksums.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
